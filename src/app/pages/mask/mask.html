<div class="mask-layout">
  <section class="map-pane" aria-label="GeoJSON mask map">
    <div #mapContainer class="map"></div>
  </section>

  <aside class="controls-pane" aria-label="GeoJSON mask controls">
    <section class="control-panel" aria-labelledby="maskInputHeading">
      <div class="panel-heading">
        <h1 id="maskInputHeading">GeoJSON input</h1>
        <p>Enter polygon features to create an inverse world mask.</p>
      </div>

      <label class="visually-hidden" for="maskInput">Polygon or MultiPolygon GeoJSON</label>
      <textarea
        id="maskInput"
        class="form-control mask-input"
        [class.is-invalid]="errorMessage()"
        [formControl]="inputControl"
        aria-describedby="maskInputError"
        spellcheck="false"
      ></textarea>
      @if (errorMessage()) {
        <div class="invalid-feedback" id="maskInputError">{{ errorMessage() }}</div>
      }
      <div class="input-actions">
        <div class="point-buffer-field">
          <label for="pointBuffer">Point buffer</label>
          <div class="input-group input-group-sm">
            <input
              id="pointBuffer"
              class="form-control"
              [class.is-invalid]="pointBufferError()"
              type="number"
              min="0.01"
              step="1"
              [formControl]="pointBufferControl"
              aria-describedby="pointBufferUnit pointBufferError"
            />
            <span class="input-group-text" id="pointBufferUnit">metres</span>
          </div>
          @if (pointBufferError()) {
            <div class="buffer-error" id="pointBufferError">{{ pointBufferError() }}</div>
          }
        </div>
        <button
          class="btn btn-primary btn-sm"
          type="button"
          [disabled]="errorMessage() || pointBufferError()"
          (click)="zoomToInput()"
        >
          Zoom to input
        </button>
      </div>
    </section>

    <section class="control-panel" aria-labelledby="maskOutputHeading">
      <div class="panel-heading">
        <h2 id="maskOutputHeading">Inverse GeoJSON</h2>
        <p>World polygon with the input geometry removed.</p>
      </div>

      <label class="visually-hidden" for="maskOutput">Formatted inverse GeoJSON</label>
      <textarea
        id="maskOutput"
        class="form-control mask-output"
        [value]="outputValue()"
        readonly
        spellcheck="false"
      ></textarea>
      <div class="output-actions">
        <span class="copy-status" aria-live="polite">{{ copyStatus() }}</span>
        <button class="btn btn-outline-primary btn-sm" type="button" (click)="copyOutput()">
          Copy to clipboard
        </button>
      </div>
    </section>
  </aside>
</div>
