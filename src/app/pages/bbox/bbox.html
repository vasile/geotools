<div class="bbox-layout">
  <section class="map-pane" aria-label="Bounding box map">
    <div #mapContainer class="map"></div>
  </section>

  <aside class="controls-pane" aria-label="Bounding box controls">
    <section class="control-panel">
      <div class="panel-heading">
        <div class="heading-row">
          <h1>Bounding box</h1>
          <div class="btn-group btn-group-sm mode-switch" role="group" aria-label="Construction mode">
          <button
            class="btn btn-outline-secondary"
            [class.active]="rectangleMode === 'bounds'"
            [attr.aria-pressed]="rectangleMode === 'bounds'"
            type="button"
            (click)="rectangleModeChanged('bounds')"
          >
            Box
          </button>
          <button
            class="btn btn-outline-secondary"
            [class.active]="rectangleMode === 'center'"
            [attr.aria-pressed]="rectangleMode === 'center'"
            type="button"
            (click)="rectangleModeChanged('center')"
          >
            Center
          </button>
          <button
            class="btn btn-outline-secondary"
            [class.active]="rectangleMode === 'circle'"
            [attr.aria-pressed]="rectangleMode === 'circle'"
            type="button"
            (click)="rectangleModeChanged('circle')"
          >
            Circle
          </button>
          </div>
        </div>
        <p>{{ modeDescription }}</p>
      </div>

      <form (ngSubmit)="applyRectangle()" novalidate>
        @if (rectangleMode === 'bounds') {
          <div class="primary-input-row">
            <div class="input-group">
              <span class="input-group-text">Coords</span>
              <input
                id="bboxInput"
                name="bbox"
                class="form-control"
                [class.is-invalid]="errorMessage"
                [(ngModel)]="bboxValue"
                (ngModelChange)="rectangleValueChanged()"
                placeholder="west,south,east,north"
                aria-label="West, south, east and north coordinates"
                aria-describedby="bboxError"
              />
            </div>
            <button class="btn btn-primary" type="submit">Apply</button>
          </div>
        } @else if (rectangleMode === 'center') {
          <div class="primary-input-row">
            <div class="input-group">
              <span class="input-group-text">Center</span>
              <input
                id="centerInput"
                name="center"
                class="form-control"
                [class.is-invalid]="errorMessage"
                [(ngModel)]="centerValue"
                (ngModelChange)="rectangleValueChanged()"
                placeholder="longitude,latitude"
                aria-label="Center longitude and latitude"
                aria-describedby="bboxError"
              />
            </div>
            <button class="btn btn-primary" type="submit">Apply</button>
          </div>

          <div class="dimension-fields">
            <div class="input-group input-group-sm">
              <span class="input-group-text">W</span>
              <input
                id="widthInput"
                name="width"
                class="form-control"
                type="number"
                min="1"
                step="1"
                [(ngModel)]="widthValue"
                (ngModelChange)="rectangleValueChanged()"
                aria-label="Width in metres"
              />
              <span class="input-group-text">m</span>
            </div>
            <div class="input-group input-group-sm">
              <span class="input-group-text">H</span>
              <input
                id="heightInput"
                name="height"
                class="form-control"
                type="number"
                min="1"
                step="1"
                [(ngModel)]="heightValue"
                (ngModelChange)="rectangleValueChanged()"
                aria-label="Height in metres"
              />
              <span class="input-group-text">m</span>
            </div>
          </div>
        } @else {
          <div class="primary-input-row">
            <div class="input-group">
              <span class="input-group-text">Center</span>
              <input
                id="circleCenterInput"
                name="circleCenter"
                class="form-control"
                [class.is-invalid]="errorMessage"
                [(ngModel)]="centerValue"
                (ngModelChange)="rectangleValueChanged()"
                placeholder="longitude,latitude"
                aria-label="Circle center longitude and latitude"
                aria-describedby="bboxError"
              />
            </div>
            <button class="btn btn-primary" type="submit">Apply</button>
          </div>

          <div class="circle-radius-field input-group input-group-sm">
            <span class="input-group-text">Radius</span>
            <input
              id="radiusInput"
              name="radius"
              class="form-control"
              type="number"
              min="1"
              step="1"
              [(ngModel)]="radiusValue"
              (ngModelChange)="rectangleValueChanged()"
              aria-label="Radius in metres"
            />
            <span class="input-group-text">m</span>
          </div>
        }

        @if (errorMessage) {
          <div class="center-error" id="bboxError">{{ errorMessage }}</div>
        }

        <div class="viewport-action">
          <span>or construct from</span>
          <button class="btn btn-link btn-sm" type="button" (click)="useMapViewport()">
            current map viewport
          </button>
        </div>
      </form>
    </section>

    <section class="control-panel output-panel" aria-labelledby="outputHeading">
      <div class="panel-heading output-heading">
        <h2 id="outputHeading">Output</h2>
        <select
          id="outputFormat"
          name="outputFormat"
          class="form-select form-select-sm output-format"
          [(ngModel)]="outputFormat"
          (ngModelChange)="outputFormatChanged($event)"
          aria-label="Output format"
        >
          <option value="geojson">GeoJSON</option>
          <option value="wkt">WKT</option>
          <option value="kml">KML</option>
          <option value="bbox">BBox array</option>
          <option value="postgis">PostGIS SQL</option>
          <option value="csv">CSV</option>
          <option value="gml">GML</option>
          <option value="ojp-rectangle">
            OJP {{ rectangleMode === 'circle' ? 'Circle' : 'Rectangle' }}
          </option>
        </select>
      </div>
      <p class="output-description">{{ outputDescription }}</p>

      <label class="visually-hidden" for="formattedOutput">Formatted BBox output</label>
      <textarea
        id="formattedOutput"
        class="form-control formatted-output"
        [value]="outputValue"
        readonly
        spellcheck="false"
      ></textarea>

      <div class="output-actions">
        <span class="copy-status" aria-live="polite">{{ copyStatus() }}</span>
        <button class="btn btn-outline-primary btn-sm" type="button" (click)="copyOutput()">
          Copy to clipboard
        </button>
      </div>
    </section>
  </aside>
</div>
