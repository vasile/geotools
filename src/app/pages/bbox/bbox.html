<div class="bbox-layout">
  <section class="map-pane" aria-label="Bounding box map">
    <div #mapContainer class="map"></div>
  </section>

  <aside class="controls-pane" aria-label="Bounding box controls">
    <section class="control-panel">
      <div class="panel-heading">
        <h1>Bounding box</h1>
        <p>Enter the southwest and northeast coordinates.</p>
      </div>

      <form (ngSubmit)="applyBounds()" novalidate>
        <label class="form-label" for="bboxInput">Coordinates</label>
        <div class="input-group" [class.has-validation]="errorMessage">
          <input
            id="bboxInput"
            name="bbox"
            class="form-control"
            [class.is-invalid]="errorMessage"
            [(ngModel)]="bboxValue"
            (ngModelChange)="bboxValueChanged($event)"
            placeholder="swx,swy,nex,ney"
            aria-describedby="bboxHelp bboxError"
          />
          <button class="btn btn-primary" type="submit">Apply</button>
          @if (errorMessage) {
            <div class="invalid-feedback" id="bboxError">{{ errorMessage }}</div>
          }
        </div>
        <div class="form-text" id="bboxHelp">Format: swx,swy,nex,ney</div>
      </form>
    </section>
    <section class="control-panel output-panel" aria-labelledby="outputHeading">
      <div class="panel-heading">
        <h2 id="outputHeading">Output</h2>
        <p>Formatted polygon for the current bounding box.</p>
      </div>

      <label class="form-label" for="outputFormat">Format</label>
      <select
        id="outputFormat"
        name="outputFormat"
        class="form-select form-select-sm output-format"
        [(ngModel)]="outputFormat"
        (ngModelChange)="outputFormatChanged($event)"
      >
        <option value="geojson">GeoJSON</option>
        <option value="wkt">WKT</option>
        <option value="kml">KML</option>
        <option value="bbox">BBox array</option>
        <option value="postgis">PostGIS SQL</option>
        <option value="csv">CSV</option>
        <option value="gml">GML</option>
        <option value="ojp-rectangle">OJP Rectangle</option>
      </select>

      <label class="visually-hidden" for="formattedOutput">Formatted BBox output</label>
      <textarea
        id="formattedOutput"
        class="form-control formatted-output"
        [value]="outputValue"
        readonly
        spellcheck="false"
      ></textarea>

      <div class="output-actions">
        <span class="copy-status" aria-live="polite">{{ copyStatus() }}</span>
        <button class="btn btn-outline-primary btn-sm" type="button" (click)="copyOutput()">
          Copy to clipboard
        </button>
      </div>
    </section>
  </aside>
</div>
