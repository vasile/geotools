<header class="app-header navbar navbar-expand bg-white border-bottom">
  <div class="container-fluid justify-content-start gap-4 px-3 px-md-4">
    <a
      class="navbar-brand d-flex align-items-center gap-2 py-0"
      routerLink="/bbox"
      [queryParams]="bboxQueryParams()"
    >
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="m3.5 6.2 5-2.7 7 2.7 5-2.7v14.3l-5 2.7-7-2.7-5 2.7V6.2Z" />
          <path d="M8.5 3.5v14.3m7-11.6v14.3" />
        </svg>
      </span>
      <span class="fw-semibold">{{ title }}</span>
    </a>

    <nav class="d-flex gap-2" aria-label="Main navigation">
      <a
        class="nav-link px-2"
        routerLink="/bbox"
        [queryParams]="bboxQueryParams()"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [attr.aria-disabled]="currentPage() === 'bbox' ? 'true' : null"
        [attr.tabindex]="currentPage() === 'bbox' ? -1 : null"
      >
        BBox
      </a>
      <a
        class="nav-link px-2"
        routerLink="/mask"
        [queryParams]="maskQueryParams()"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [attr.aria-disabled]="currentPage() === 'mask' ? 'true' : null"
        [attr.tabindex]="currentPage() === 'mask' ? -1 : null"
      >
        GeoMask
      </a>
    </nav>
  </div>
</header>

<main class="app-content">
  <router-outlet />
</main>

<footer class="app-footer border-top bg-white px-3 px-md-4">
  <small>GeoTools · Browser-based geographic utilities</small>
</footer>
